<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tell Us the Details — Honnibear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
</head>
<body>

<nav class="simple">
  <div class="wrap">
    <a href="index.html" class="brand"><img src="images/logo.png" alt="Honnibear logo"> Honnibear</a>
    <a href="commission-status.html" style="font-weight:700; font-size:0.92rem; text-decoration:none;">Check Order Status</a>
  </div>
</nav>

<div class="wrap" style="max-width:640px;">
  <div class="panel">
    <h1 class="page-title">🎉 Thanks for your order!</h1>
    <p class="subtitle" id="intro-text">One quick step left — tell us the details so we can get started.</p>

    <div id="messages"></div>
    <div id="loading" class="spinner-text">Loading your order…</div>
    <form id="intake-form" style="display:none;"></form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/formFields.js"></script>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  const messagesEl = document.getElementById('messages');
  const loadingEl = document.getElementById('loading');
  const formEl = document.getElementById('intake-form');
  const introEl = document.getElementById('intro-text');

  function showMessage(text, type){
    messagesEl.innerHTML = '<div class="message ' + type + '">' + text + '</div>';
  }

  if (!sessionId) {
    loadingEl.style.display = 'none';
    showMessage('We couldn\'t find a Stripe session in this link. If you just paid, use the link from your confirmation email, or <a href="commission-status.html">check your order status here</a>.', 'error');
    return;
  }

  function renderForm(order, product){
    const fields = window.HonnibearFields.fieldsForSlug(order.product_slug);
    const isArt = product.type === 'art';

    let html = '<p class="hint" style="margin-bottom:18px;">Order <strong>' + order.order_code + '</strong> &middot; ' + order.product_name + '</p>';
    fields.forEach(function(f){
      html += '<label for="' + f.name + '">' + f.label + (f.required ? ' *' : '') + '</label>';
      if (f.type === 'textarea') {
        html += '<textarea id="' + f.name + '" name="' + f.name + '"' + (f.required ? ' required' : '') + '></textarea>';
      } else {
        html += '<input type="' + f.type + '" id="' + f.name + '" name="' + f.name + '"' + (f.required ? ' required' : '') + '>';
      }
    });

    html += '<label for="photos">Reference photos' + (isArt ? '' : ' (optional)') + '</label>';
    html += '<input type="file" id="photos" name="photos" accept="image/png,image/jpeg,image/webp" multiple>';
    html += '<div class="hint">JPEG, PNG, or WEBP. Up to 6 photos, 8MB each.' + (isArt ? ' At least one clear reference photo is strongly recommended.' : '') + '</div>';

    html += '<button type="submit" class="btn" id="submit-btn">Submit My Details</button>';
    formEl.innerHTML = html;
    formEl.style.display = 'block';

    formEl.addEventListener('submit', function(e){
      e.preventDefault();
      submitIntake(order, fields);
    });
  }

  function submitIntake(order, fields){
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    const details = {};
    fields.forEach(function(f){ details[f.name] = document.getElementById(f.name).value; });

    const formData = new FormData();
    formData.append('details', JSON.stringify(details));
    const photoInput = document.getElementById('photos');
    Array.from(photoInput.files || []).forEach(function(file){ formData.append('photos', file); });

    fetch(window.HONNIBEAR_API_BASE + '/api/orders/' + encodeURIComponent(order.order_code) + '/intake', {
      method: 'POST',
      body: formData,
    })
      .then(function(res){ return res.json().then(function(body){ return { ok: res.ok, body: body }; }); })
      .then(function(result){
        if (!result.ok) throw new Error(result.body.error || 'Something went wrong.');
        formEl.style.display = 'none';
        introEl.textContent = "You're all set!";
        showMessage("Got it! We'll be in touch by email as we work on your " + order.product_name.toLowerCase() + ". You can check your order status any time using order code <strong>" + order.order_code + "</strong>.", 'success');
      })
      .catch(function(err){
        showMessage(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit My Details';
      });
  }

  fetch(window.HONNIBEAR_API_BASE + '/api/orders/by-session/' + encodeURIComponent(sessionId))
    .then(function(res){ return res.json().then(function(body){ return { ok: res.ok, body: body }; }); })
    .then(function(result){
      loadingEl.style.display = 'none';
      if (!result.ok) { showMessage(result.body.error, 'error'); return; }
      const order = result.body;

      if (order.status !== 'paid') {
        introEl.textContent = "You've already sent us your details!";
        showMessage('This order (' + order.order_code + ') is currently <span class="status-pill status-' + order.status + '">' + order.status.replace('_',' ') + '</span>. <a href="commission-status.html">Check full status here</a>.', 'info');
        return;
      }

      fetch(window.HONNIBEAR_API_BASE + '/api/orders/product/' + encodeURIComponent(order.product_slug))
        .then(function(res){ return res.json(); })
        .then(function(product){ renderForm(order, product); });
    })
    .catch(function(){
      loadingEl.style.display = 'none';
      showMessage('Could not reach the Honnibear server. Please refresh in a moment, or contact us if this keeps happening.', 'error');
    });
})();
</script>

</body>
</html>
